<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Momoy Portfolio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Krub:wght@400;600&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            height: 100%;
            font-family: 'Krub', sans-serif;
        }

        .hero-section {
            position: relative;
            width: 100%;
            height: 100vh;
            background-image: linear-gradient(rgba(0, 0, 0, 0.25), rgba(0, 0, 0, 0.25)), url(momay.jpg);
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            color: #ffffff;
        }

        .hero-content {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .sub-heading {
            font-size: 1.1rem;
            letter-spacing: 6px;
            font-weight: 400;
            margin-bottom: 5px;
            text-shadow: 0px 2px 4px rgba(0, 0, 0, 0.5);
        }

        .main-title {
            font-family: 'Caveat', cursive;
            font-size: 8.5rem;
            line-height: 1;
            font-weight: 700;
            margin-bottom: 10px;
            text-shadow: 0px 4px 10px rgba(0, 0, 0, 0.4);
        }

        .section-tag {
            font-size: 1.4rem;
            font-weight: 600;
            letter-spacing: 2px;
            margin-bottom: 35px;
            text-shadow: 0px 2px 4px rgba(0, 0, 0, 0.5);
        }

        .btn-learn-more {
            display: inline-block;
            background-color: #ffffff;
            color: #111111;
            padding: 8px 30px;
            font-size: 0.95rem;
            font-weight: 600;
            text-decoration: none;
            border-radius: 2px;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.3);
        }

        .btn-learn-more:hover {
            background-color: #f0f0f0;
            transform: translateY(-2px);
            box-shadow: 0px 6px 12px rgba(0, 0, 0, 0.4);
        }
    </style>
</head>
<body>

    <section class="hero-section">
        <div class="hero-content">
            <p class="sub-heading">ยิ น ดี ต้ อ น รั บ สู่</p>
            <h1 class="main-title">Momoy :) </h1>
            <p class="section-tag">ผลงาน</p>

            <a href="index2.html" class="btn-learn-more">ดูผลงาน</a>
        </div>
    </section>

</body>
</html>
